map $scheme $hsts_header {
    https   "max-age=63072000; preload";
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

server {
  set $forward_scheme http;
  set $server         "llamoca-app";
  set $port           80;

  listen 80;
  listen [::]:80;
  listen 443 ssl;
  listen [::]:443 ssl;

  server_name llamoca.enlace.ink;
  http2 off;

  if ($scheme = "http") {
    return 301 https://$host$request_uri;
  }

  add_header Strict-Transport-Security $hsts_header always;

  include conf.d/include/letsencrypt-acme-challenge.conf;
  include conf.d/include/ssl-cache.conf;
  include conf.d/include/ssl-ciphers.conf;
  ssl_certificate /etc/letsencrypt/live/llamoca.enlace.ink/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/llamoca.enlace.ink/privkey.pem;

  include conf.d/include/block-exploits.conf;

  access_log /data/logs/proxy-host-17_access.log proxy;
  error_log /data/logs/proxy-host-17_error.log warn;

  location / {
    include conf.d/include/proxy.conf;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_read_timeout 86400s;
    proxy_send_timeout 86400s;
  }

  include /data/nginx/custom/server_proxy[.]conf;
}
