name: Mundialito - APK Android

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

concurrency:
  group: mundialito-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    defaults:
      run:
        shell: bash
    env:
      ANDROID_API: "34"
      ANDROID_NDK_VERSION: "25.1.8937393"
      ANDROID_BUILD_TOOLS: "34.0.0"
      ANDROID_COMMAND_TOOLS: "11076708"

    steps:
      - name: Descargar proyecto
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Preparar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Instalar dependencias Linux
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential git curl zip unzip autoconf automake libtool \
            pkg-config cmake patch gettext autopoint zlib1g-dev \
            libncurses5-dev libncursesw5-dev libtinfo5 libffi-dev libssl-dev

      - name: Instalar herramientas Python con versiones fijas
        run: |
          python -m pip install "pip==24.0"
          python -m pip install "buildozer==1.6.0" "Cython==0.29.33" \
            "setuptools==69.5.1" "wheel==0.43.0"

      - name: Validar estructura del proyecto PNG
        run: |
          python - <<'PY'
          import configparser
          import pathlib
          import py_compile
          root = pathlib.Path('.')
          required = ('main.py', 'tournament.py', 'presentation.py', 'buildozer.spec',
                      'assets/images/brazos_ganador.png', 'assets/images/copa.png',
                      'assets/animations/gol.gif')
          missing = [name for name in required if not (root / name).is_file()]
          if missing:
              raise SystemExit('Faltan archivos en la raiz del repositorio: ' + ', '.join(missing))
          config = configparser.ConfigParser(interpolation=None)
          config.read('buildozer.spec', encoding='utf-8')
          if config['app'].get('source.dir', '.').strip() != '.':
              raise SystemExit('Esta configuracion requiere source.dir = .')
          for name in ('main.py', 'tournament.py', 'presentation.py'):
              py_compile.compile(name, doraise=True)
          print('Estructura PNG y sintaxis Python comprobadas.')
          PY

      - name: Instalar SDK y NDK compatibles en carpeta aislada
        run: |
          SDK="$RUNNER_TEMP/mundialito-android-sdk"
          mkdir -p "$SDK"
          curl --fail --location --retry 3 \
            "https://dl.google.com/android/repository/commandlinetools-linux-${ANDROID_COMMAND_TOOLS}_latest.zip" \
            -o "$RUNNER_TEMP/android-tools.zip"
          unzip -q "$RUNNER_TEMP/android-tools.zip" -d "$SDK"
          # Buildozer busca tools/bin/sdkmanager; no usa el SDK preinstalado del runner.
          mv "$SDK/cmdline-tools" "$SDK/tools"
          for i in {1..200}; do printf 'y\n'; done > "$RUNNER_TEMP/android-license-answers.txt"
          "$SDK/tools/bin/sdkmanager" --sdk_root="$SDK" --licenses \
            < "$RUNNER_TEMP/android-license-answers.txt"
          "$SDK/tools/bin/sdkmanager" --sdk_root="$SDK" \
            "platform-tools" "platforms;android-${ANDROID_API}" \
            "build-tools;${ANDROID_BUILD_TOOLS}" "ndk;${ANDROID_NDK_VERSION}" \
            < "$RUNNER_TEMP/android-license-answers.txt"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$SDK/ndk/$ANDROID_NDK_VERSION" >> "$GITHUB_ENV"
          echo "$SDK/tools/bin" >> "$GITHUB_PATH"
          echo "$SDK/platform-tools" >> "$GITHUB_PATH"
          test -x "$SDK/build-tools/$ANDROID_BUILD_TOOLS/aidl"
          test -f "$SDK/ndk/$ANDROID_NDK_VERSION/source.properties"

      - name: Ajustar solo herramientas Android para esta compilacion
        run: |
          python - <<'PY'
          import configparser
          import os
          config = configparser.ConfigParser(interpolation=None)
          config.read('buildozer.spec', encoding='utf-8')
          app = config['app']
          app['android.api'] = os.environ['ANDROID_API']
          app['android.minapi'] = '21'
          app['android.ndk'] = '25b'
          app['android.ndk_api'] = '21'
          app['android.sdk_path'] = os.environ['ANDROID_HOME']
          app['android.ndk_path'] = os.environ['ANDROID_NDK_HOME']
          app['android.skip_update'] = 'True'
          app['android.accept_sdk_license'] = 'True'
          app['p4a.branch'] = 'v2024.01.21'
          extensions = [part.strip() for part in app.get('source.include_exts', '').split(',') if part.strip()]
          for extension in ('png', 'gif', 'json', 'mp3', 'wav', 'py'):
              if extension not in extensions:
                  extensions.append(extension)
          app['source.include_exts'] = ','.join(extensions)
          # Identidad, requisitos Kivy/Pillow, orientacion y arquitecturas no cambian.
          with open('buildozer.spec', 'w', encoding='utf-8') as stream:
              config.write(stream)
          PY
          python -m pip freeze > herramientas-apk.txt

      - name: Compilar APK debug
        run: |
          set -o pipefail
          buildozer -v android debug 2>&1 | tee compilacion-apk.log

      - name: Publicar APK descargable
        uses: actions/upload-artifact@v4
        with:
          name: Mundialito-APK-debug
          path: bin/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Guardar diagnostico incluso si falla
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Mundialito-diagnostico
          path: |
            compilacion-apk.log
            herramientas-apk.txt
            buildozer.spec
          if-no-files-found: warn
          retention-days: 7
  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Descargar proyecto
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar Kivy y PyInstaller
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install "kivy==2.3.0" "pyinstaller==6.10.0"

      - name: Validar archivos del juego
        shell: pwsh
        run: |
          python -m py_compile main.py tournament.py presentation.py

      - name: Compilar EXE para Windows
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --onefile --windowed --name Mundialito --add-data "assets;assets" --add-data "musica_fondo.mp3;." main.py

      - name: Publicar EXE descargable
        uses: actions/upload-artifact@v4
        with:
          name: Mundialito-Windows-EXE
          path: dist/Mundialito.exe
          if-no-files-found: error
          retention-days: 14
          
          

          
