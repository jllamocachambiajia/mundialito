[app]

# (str) Título de tu aplicación
title = Copa Mundial Chapas

# (str) Nombre del paquete (sin espacios ni mayúsculas)
package.name = copamundialchapas

# (str) Dominio del paquete
package.domain = org.copamundial

# (str) Directorio fuente donde está tu main.py (relativo a este archivo)
source.dir = .

# (list) Archivos fuente a incluir (extensiones permitidas)
source.include_exts = py,png,jpg,kv,atlas,json,ogg,wav,ttf

# (list) Directorios a excluir (opcional)
#source.exclude_dirs = tests, bin, venv

# (list) Archivos a excluir (opcional)
#source.exclude_exts = spec

# (list) Requisitos de tu aplicación
# Añade aquí todas las librerías de Python que necesite tu juego
requirements = python3,kivy,pillow,sdl2_mixer,sdl2_image,pyjnius

# (str) Versión de la aplicación
version = 0.1

# (list) Icono de la aplicación (descomenta y apunta a tu archivo si lo tienes)
#icon.filename = %(source.dir)s/data/icon.png

# (list) Pantalla de carga / Splash screen (descomenta si la tienes)
#presplash.filename = %(source.dir)s/data/splash.png

# (list) Orientación soportada (landscape para horizontal, portrait para vertical)
orientation = landscape

# (bool) Indicar si la aplicación es o no de pantalla completa
fullscreen = 1

# (list) Permisos de Android necesarios (descomenta si usas internet, vibración, etc.)
#android.permissions = INTERNET,VIBRATE

# (list) Características requeridas por la aplicación (opcional)
#android.features = android.hardware.usb.host

# (str) Versión mínima del SDK de Android soportada
android.minapi = 21

# (int) SDK de Android de destino
android.api = 33

# (str) Versión del NDK de Android a utilizar
android.ndk = 25b

# (str) Versión de las herramientas de compilación de Android
android.build_tools_version = 33.0.2

# (bool) Usar o no AndroidX (recomendado True para librerías modernas)
android.androidx = True

# (list) Arquitecturas de Android a compilar (arm64-v8a para modernos, armeabi-v7a para antiguos)
android.archs = arm64-v8a, armeabi-v7a

# (str) Clave de firma para modo release (dejar comentado para compilación debug en GitHub Actions)
#android.release_artifact = aar
#android.debug_artifact = apk

[buildozer]

# (int) Nivel de registro (0 = error, 1 = info, 2 = debug con información detallada)
log_level = 2

# (int) Indicar si se muestra advertencia al ejecutar como root (0 = falso, 1 = verdadero)
warn_on_root = 1

# (str) Directorio donde se descargan las dependencias del SDK/NDK (por defecto .buildozer)
#build_dir = .buildozer

# (str) Directorio de salida para los binarios compilados (APKs)
#bin_dir = ./bin
