name: Mundialito - APK Android y Windows EXE

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

concurrency:
  group: mundialito-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # =========================================================================
  # TRABAJO 1: APK PARA ANDROID (Ubuntu 22.04)
  # =========================================================================
  apk:
    name: Compilar APK Android
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    defaults:
      run:
        shell: bash
    env:
      ANDROID_API: "34"
      ANDROID_NDK_VERSION: "25.1.8937393"
      ANDROID_BUILD_TOOLS: "34.0.0"
      ANDROID_COMMAND_TOOLS: "11076708"

    steps:
      - name: Descargar proyecto
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Preparar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Instalar dependencias Linux
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential git curl zip unzip autoconf automake libtool \
            pkg-config cmake patch gettext autopoint zlib1g-dev \
            libncurses5-dev libncursesw5-dev libtinfo5 libffi-dev libssl-dev

      - name: Instalar herramientas Python con versiones fijas
        run: |
          python -m pip install "pip==24.0"
          python -m pip install "buildozer==1.6.0" "Cython==0.29.33" \
            "setuptools==69.5.1" "wheel==0.43.0"

      - name: Validar estructura del proyecto
        run: |
          python - <<'PY'
          import configparser
          import pathlib
          import py_compile
          root = pathlib.Path('.')
          required = ('main.py', 'buildozer.spec')
          missing = [name for name in required if not (root / name).is_file()]
          if missing:
              raise SystemExit('Faltan archivos basicos en la raiz: ' + ', '.join(missing))
          config = configparser.ConfigParser(interpolation=None)
          config.read('buildozer.spec', encoding='utf-8')
          if config['app'].get('source.dir', '.').strip() != '.':
              raise SystemExit('Esta configuracion requiere source.dir = .')
          for name in ('main.py', 'tournament.py', 'presentation.py', 'network_client.py', 'online_view.py'):
              if (root / name).is_file():
                  py_compile.compile(name, doraise=True)
          print('Estructura y sintaxis Python validadas correctamente.')
          PY

      - name: Instalar SDK y NDK compatibles en carpeta aislada
        run: |
          SDK="$RUNNER_TEMP/mundialito-android-sdk"
          mkdir -p "$SDK"
          curl --fail --location --retry 3 \
            "https://dl.google.com/android/repository/commandlinetools-linux-${ANDROID_COMMAND_TOOLS}_latest.zip" \
            -o "$RUNNER_TEMP/android-tools.zip"
          unzip -q "$RUNNER_TEMP/android-tools.zip" -d "$SDK"
          mv "$SDK/cmdline-tools" "$SDK/tools"
          for i in {1..200}; do printf 'y\n'; done > "$RUNNER_TEMP/android-license-answers.txt"
          "$SDK/tools/bin/sdkmanager" --sdk_root="$SDK" --licenses \
            < "$RUNNER_TEMP/android-license-answers.txt"
          "$SDK/tools/bin/sdkmanager" --sdk_root="$SDK" \
            "platform-tools" "platforms;android-${ANDROID_API}" \
            "build-tools;${ANDROID_BUILD_TOOLS}" "ndk;${ANDROID_NDK_VERSION}" \
            < "$RUNNER_TEMP/android-license-answers.txt"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$SDK/ndk/$ANDROID_NDK_VERSION" >> "$GITHUB_ENV"
          echo "$SDK/tools/bin" >> "$GITHUB_PATH"
          echo "$SDK/platform-tools" >> "$GITHUB_PATH"
          test -x "$SDK/build-tools/$ANDROID_BUILD_TOOLS/aidl"
          test -f "$SDK/ndk/$ANDROID_NDK_VERSION/source.properties"

      - name: Ajustar herramientas Android y permisos de red para multijugador
        run: |
          python - <<'PY'
          import configparser
          import os
          config = configparser.ConfigParser(interpolation=None)
          config.read('buildozer.spec', encoding='utf-8')
          app = config['app']
          app['android.api'] = os.environ['ANDROID_API']
          app['android.minapi'] = '21'
          app['android.ndk'] = '25b'
          app['android.ndk_api'] = '21'
          app['android.sdk_path'] = os.environ['ANDROID_HOME']
          app['android.ndk_path'] = os.environ['ANDROID_NDK_HOME']
          app['android.skip_update'] = 'True'
          app['android.accept_sdk_license'] = 'True'
          app['p4a.branch'] = 'v2024.01.21'
          
          # Extensiones a incluir
          extensions = [part.strip() for part in app.get('source.include_exts', '').split(',') if part.strip()]
          for extension in ('png', 'gif', 'json', 'mp3', 'wav', 'ogg', 'py', 'ttf'):
              if extension not in extensions:
                  extensions.append(extension)
          app['source.include_exts'] = ','.join(extensions)

          # Asegurar permisos de red e internet
          perms = [p.strip() for p in app.get('android.permissions', '').split(',') if p.strip()]
          for p in ('INTERNET', 'ACCESS_NETWORK_STATE'):
              if p not in perms:
                  perms.append(p)
          app['android.permissions'] = ','.join(perms)
          app['android.manifest.application_arguments'] = 'android:usesCleartextTraffic="true"'

          # Asegurar dependencias de red
          reqs = [r.strip() for r in app.get('requirements', '').split(',') if r.strip()]
          if 'websocket-client' not in reqs:
              reqs.append('websocket-client')
          app['requirements'] = ','.join(reqs)

          with open('buildozer.spec', 'w', encoding='utf-8') as stream:
              config.write(stream)
          PY
          python -m pip freeze > herramientas-apk.txt

      - name: Compilar APK debug
        run: |
          set -o pipefail
          buildozer -v android debug 2>&1 | tee compilacion-apk.log

      - name: Publicar APK descargable
        uses: actions/upload-artifact@v4
        with:
          name: Mundialito-APK-debug
          path: bin/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Guardar diagnostico incluso si falla
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Mundialito-diagnostico
          path: |
            compilacion-apk.log
            herramientas-apk.txt
            buildozer.spec
          if-no-files-found: warn
          retention-days: 7

  # =========================================================================
  # TRABAJO 2: EJECUTABLE .EXE PARA WINDOWS (Con soporte ANGLE / DirectX)
  # =========================================================================
  windows:
    name: Compilar EXE Windows
    runs-on: windows-latest
    timeout-minutes: 25
    defaults:
      run:
        shell: bash
    env:
      KIVY_GL_BACKEND: "angle_sdl2"

    steps:
      - name: Descargar proyecto
        uses: actions/checkout@v4

      - name: Configurar Python 3.11 con binarios oficiales
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Instalar dependencias precompiladas de Windows (incluyendo ANGLE y red)
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install "kivy[base]" kivy_deps.sdl2 kivy_deps.glew kivy_deps.angle pillow pyinstaller websocket-client requests

      - name: Validar sintaxis de archivos Python
        run: |
          python - << 'PY'
          import glob
          import py_compile
          for file in glob.glob("*.py"):
              py_compile.compile(file, doraise=True)
          print("Archivos Python validados correctamente.")
          PY

      - name: Generar especificacion PyInstaller con soporte completo de Kivy, ANGLE y Red
        run: |
          python - << 'PY'
          import os
          spec_code = """# -*- mode: python ; coding: utf-8 -*-
          import os
          from PyInstaller.building.build_main import Analysis, PYZ, EXE, COLLECT
          from PyInstaller.building.datastruct import Tree
          from kivy.tools.packaging.pyinstaller_hooks import get_deps_minimal, hookspath, runtime_hooks
          from kivy_deps import sdl2, glew, angle

          datas = []
          if os.path.exists('assets'):
              datas.append(('assets', 'assets'))

          for f in os.listdir('.'):
              if f.endswith(('.mp3', '.ogg', '.wav', '.json')) and os.path.isfile(f):
                  datas.append((f, '.'))

          kivy_deps = get_deps_minimal(video=False, camera=False)
          hidden_imports = [
              'sqlite3',
              'json',
              'math',
              'random',
              'PIL',
              'kivy',
              'kivy.core.audio.audio_sdl2',
              'kivy.core.window.window_sdl2',
              'kivy.core.image.img_sdl2',
              'kivy.core.text.text_sdl2',
              'websocket',
              'urllib',
              'urllib.request',
              'urllib.error',
              'urllib.parse',
          ] + kivy_deps.get('hiddenimports', [])
          excluded_imports = ['tkinter'] + kivy_deps.get('excludes', [])

          a = Analysis(
              ['main.py'],
              pathex=['.'],
              binaries=[],
              datas=datas,
              hiddenimports=hidden_imports,
              hookspath=hookspath(),
              runtime_hooks=runtime_hooks(),
              excludes=excluded_imports,
              win_no_prefer_redirects=False,
              win_private_assemblies=False,
              noarchive=False
          )

          pyz = PYZ(a.pure, a.zipped_data)

          exe = EXE(
              pyz,
              a.scripts,
              [],
              exclude_binaries=True,
              name='Mundialito',
              debug=False,
              bootloader_ignore_signals=False,
              strip=False,
              upx=False,
              console=False
          )

          coll = COLLECT(
              exe,
              a.binaries,
              a.zipfiles,
              a.datas,
              *[Tree(p) for p in (sdl2.dep_bins + glew.dep_bins + angle.dep_bins)],
              strip=False,
              upx=False,
              name='Mundialito',
          )
          """
          with open('Mundialito.spec', 'w', encoding='utf-8') as f:
              f.write(spec_code)
          print("Mundialito.spec generado exitosamente.")
          PY

      - name: Compilar ejecutable (modo automatico sin confirmaciones)
        run: |
          python -m PyInstaller Mundialito.spec --noconfirm

      - name: Empaquetar juego completo en archivo ZIP
        run: |
          python -c "import shutil; shutil.make_archive('dist/Mundialito-Windows', 'zip', 'dist', 'Mundialito')"

      - name: Publicar ejecutable Windows descargable
        uses: actions/upload-artifact@v4
        with:
          name: Mundialito-Windows-EXE
          path: dist/Mundialito-Windows.zip
          if-no-files-found: error
          retention-days: 14
          
