name: Servidor multijugador
on:
  push:
    branches: [multijugador]
    paths: ["server/**", ".github/workflows/servidor.yml"]
  pull_request:
    paths: ["server/**"]
  workflow_dispatch:
jobs:
  pruebas-y-docker:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Instalar dependencias
        run: pip install -r requirements.txt pytest httpx websockets
      - name: Pruebas del servidor autoritario
        run: python -m pytest -q tests
      - name: Preparar QEMU para ARM64
        uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Construir imagen Docker (ARM64 y x86)
        run: docker buildx build --platform linux/amd64,linux/arm64 -t mundialito-server:ci .
